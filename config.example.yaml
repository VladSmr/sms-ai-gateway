# Example configuration for the SMS -> GigaChat gateway.
# Copy to config.yaml and edit: cp config.example.yaml config.yaml
# String values may reference environment variables via ${VAR_NAME};
# a reference to an unset variable is a startup/reload error.
# With config.reload enabled the file is re-read on change; if the new file
# is invalid, the last-good configuration is kept (an error is logged).

# Phone numbers allowed to talk to the bot, strict E.164
# ("+" + country code). Everyone else is silently dropped (step 3).
# Placeholder below is a valid-but-fictional number: replace it with real
# numbers in production. Validation is strict, so the example must be
# runnable as-is (a non-numeric placeholder like "+79xxxxxxxxx1" would
# fail the startup check).
whitelist:
  - "+79001234567"

# Persona and brevity rules for GigaChat. Keep it strict: no emoji, no
# markdown (plain-text SMS only). The reply budget is 201 UTF-16 code units.
system_prompt: "Отвечай по-русски кратко, до 200 символов, без эмодзи и markdown."

# GigaChat client settings (step 4).
llm:
  model: GigaChat-2
  temperature: 0.4
  max_tokens: 500
  timeout_s: 90
  # OAuth/chat endpoints (official production values; usually no need to change).
  # base_url: https://api.giga.chat/v1
  # oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
  # scope: GIGACHAT_API_PERS
  # The Basic auth key from "Authorization data" on developers.sber.ru
  # (Settings -> API keys -> "Authorization data"). Injected from the
  # environment; an empty value refuses to start the application unless
  # mock mode is on (below or the MOCK_LLM env var).
  auth_key: ${GIGACHAT_AUTH_KEY}
  # Echo stub instead of the real API (tests/smoke). The MOCK_LLM=true
  # environment variable overrides this flag.
  mock: false

# Operational limits (step 3).
limits:
  max_sessions: 10        # LRU cap on concurrent sessions per sender
  history_messages: 10    # conversation history kept per session
  session_ttl_h: 24       # idle sessions expire after this many hours
  max_reply_units: 201    # reply budget in UTF-16 code units (3 SMS segments)

# Named sessions: "#N text" routes to session N, no prefix -> default one.
sessions_named:
  1: default

# REST API of the android-sms-gateway server v1.47.4 used to send replies
# (step 5). The server runs on this VPS in Docker (docker-compose.yml);
# internally it is reachable as "sms-gateway-server" (docker network).
# Caddy exposes it publicly as https://sms.{DOMAIN} so the phone can
# reach it.  From inside the container, use the internal name + port 3000:
gateway:
  # Docker internal URL (no TLS at this layer — Docker network is trusted).
  # This is the Go server's 3rd-party API endpoint (v1.47.4 listens on 3000).
  base_url: "http://sms-gateway-server:3000"
  # Full path of the send endpoint. The default matches the current docs
  # (retrieved 2026-09-17): /api/3rdparty/v1/messages
  # messages_path: /api/3rdparty/v1/messages
  # Basic auth = the per-device credentials generated by the Go server
  # on first phone connection (visible in the phone app's Home screen under
  # "Cloud Server" credentials).  NOT the phone app's web-server credentials
  # (those are separate and used for the Go server's own admin API).
  # Injected from the environment; empty values refuse to start unless mock
  # mode is on (below or the MOCK_GATEWAY env var).
  username: ${GATEWAY_USERNAME}
  password: ${GATEWAY_PASSWORD}
  # Per-request HTTP timeout for the send call.
  timeout_s: 10
  # Log-only stub instead of HTTP (tests/smoke). The MOCK_GATEWAY=true
  # environment variable overrides this flag.
  mock: false

# Inbound webhook receiver (step 2).
webhook:
  # HMAC-SHA256 signing key: the "Signing Key" from the phone app
  # (Settings -> Webhooks -> Signing Key). Injected from the environment;
  # an empty value refuses to start the application.
  secret: ${GATEWAY_HMAC_SECRET}
  # Soft per-IP request limit (in-memory, per process); exceeding it returns
  # 429 and the gateway retries later with its exponential backoff.
  rate_limit_per_min: 120
  # Requests with larger bodies are rejected with 413 before parsing.
  max_body_bytes: 65536
  # X-Timestamp must be within +-window seconds of the server clock
  # (replay protection; docs recommend +-5 minutes).
  timestamp_window_s: 300
  # W8: how long a processed event id ("seen" tombstone) is remembered for
  # dedup. MUST cover the gateway's retry horizon: the phone app retries
  # failed webhook deliveries (exponential backoff, ~45.5 h total), and a
  # tombstone that expires earlier would accept a retried delivery as new
  # (double processing). 48 h is the safe default.
  dedup_ttl_hours: 48

# Telegram alerts (step 5): watchdog + phone restarts. C1: credentials are
# injected from the environment (${TELEGRAM_BOT_TOKEN}/${TELEGRAM_CHAT_ID},
# see .env.example) instead of being pasted into this file. An empty resolved
# value = log-only mode (the pipeline keeps working without Telegram).
notify:
  telegram_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  # Expected device heartbeat cadence ("system:ping" events); the watchdog
  # alerts Telegram once after 3x this interval without a ping.
  heartbeat_interval_min: 15

# Retrieval-augmented generation over personal notes (Phase 2, disabled by default).
rag:
  enabled: false

# Hot-reload the configuration file when it changes on disk.
config:
  reload: false

# SQLite database location (relative paths are resolved against this file).
db_path: "data/gateway.db"

# Default log level; the LOG_LEVEL environment variable takes precedence.
log_level: "INFO"
